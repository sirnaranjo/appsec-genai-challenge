# Etapas de Git en las que pre-commit install deja hooks
default_install_hook_types: [pre-commit, pre-merge-commit, commit-msg, post-commit]

repos:
  - repo: local
    hooks:
      # Análisis de seguridad: envía los cambios al servidor y guarda el recibo si se aprueba
      - id: genai-scan
        name: Analisis de seguridad con IA
        entry: python hooks/genai_scan.py
        language: python
        additional_dependencies: [httpx==0.28.1, python-dotenv==1.2.4, rich==15.0.0, keyring==25.7.0]
        # Tipos de archivo que se analizan; el verificador usa estos mismos filtros
        types_or: [python, javascript, jsx, ts, tsx, java, go, php, ruby, html]
        # Ejemplos intencionalmente vulnerables; se demuestran con scripts/demo.py
        exclude: ^examples/
        # Commits normales y merges
        stages: [pre-commit, pre-merge-commit]
        # Corre aunque no haya código para analizar: todo commit necesita su recibo
        always_run: true
        # Sin ejecuciones en paralelo: el análisis y su recibo cubren el commit completo
        require_serial: true
        # Muestra el resultado también cuando se aprueba
        verbose: true

      # Agrega el recibo al mensaje del commit
      - id: genai-recibo
        name: Recibo de integridad
        entry: python hooks/recibo.py agregar
        language: python
        stages: [commit-msg]
        always_run: true

      # Verificación post-commit de la existencia del recibo. Útil para controlar los casos de --no-verify
      - id: genai-recibo-revisar
        name: Verificacion local del recibo
        entry: python hooks/recibo.py revisar
        language: python
        stages: [post-commit]
        always_run: true
        pass_filenames: false
