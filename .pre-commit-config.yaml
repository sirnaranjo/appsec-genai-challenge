repos:
  - repo: local
    hooks:
      - id: genai-scan
        name: Analisis de seguridad con IA
        entry: python hooks/genai_scan.py
        language: python
        additional_dependencies: [httpx==0.28.1, python-dotenv==1.2.4, rich==15.0.0]
        types_or: [python, javascript, jsx, ts, tsx, java, go, php, ruby, html]
        require_serial: true
        verbose: true
